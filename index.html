<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Demo WebXR para Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; }
</style>
<script>
  // Ao clicar (mouse, toque, gatilho do controle), a forma muda de cor e dá um pulso
  AFRAME.registerComponent('muda-cor', {
    init: function () {
      var el = this.el;
      el.addEventListener('click', function () {
        var cor = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
        el.setAttribute('color', cor);
        el.setAttribute('animation__pulso',
          'property: scale; from: 1.35 1.35 1.35; to: 1 1 1; dur: 350; easing: easeOutQuad');
      });
    }
  });
</script>
</head>
<body>
<a-scene background="color: #0b1020" vr-mode-ui="enabled: true">

  <!-- Chão e luzes -->
  <a-plane rotation="-90 0 0" width="30" height="30" color="#1b2a41"></a-plane>
  <a-entity light="type: ambient; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; intensity: 0.8" position="2 6 3"></a-entity>

  <!-- Texto -->
  <a-text value="Clique nas formas para mudar a cor" position="0 3.2 -3" align="center" width="6" color="#f2f2f2"></a-text>

  <!-- Formas interativas -->
  <a-box class="clicavel" muda-cor position="-1.8 1.2 -3" color="#ff6b6b"
         animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"></a-box>

  <a-sphere class="clicavel" muda-cor position="0 1.4 -3" radius="0.6" color="#4ecdc4"
            animation="property: position; to: 0 1.8 -3; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"></a-sphere>

  <a-cylinder class="clicavel" muda-cor position="1.8 1.2 -3" radius="0.5" height="1.2" color="#ffe66d"
              animation="property: rotation; to: 360 0 0; loop: true; dur: 6000; easing: linear"></a-cylinder>

  <a-torus-knot class="clicavel" muda-cor position="0 1.3 -5.5" radius="0.6" radius-tubular="0.12" color="#a78bfa"
                animation="property: rotation; to: 360 360 0; loop: true; dur: 10000; easing: linear"></a-torus-knot>

  <!-- Câmera com cursor para mouse/toque -->
  <a-entity camera look-controls wasd-controls position="0 1.6 0">
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clicavel"></a-entity>
  </a-entity>

  <!-- Controles do Quest (laser) -->
  <a-entity laser-controls="hand: left" raycaster="objects: .clicavel"></a-entity>
  <a-entity laser-controls="hand: right" raycaster="objects: .clicavel"></a-entity>

</a-scene>
</body>
</html>
